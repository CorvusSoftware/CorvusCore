name: CorvusCore engines and CorvusAPI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  native:
    name: C++ engines, CorvusAPI and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Verify no retired frontend references
        run: bash tools/check_external_frontend_refs.sh
      - name: Fetch public GBA test ROMs
        run: cores/gba/tests/fetch_test_roms.sh "$RUNNER_TEMP/gba-test-roms"
      - name: Fetch public GB/GBC test ROMs
        run: cores/gb/tests/fetch_test_roms.sh "$RUNNER_TEMP/gb-test-roms"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCORVUSCORE_BUILD_CORVUSAPI=ON
          "-DCORVUSCORE_GBA_TEST_ROMS=$RUNNER_TEMP/gba-test-roms"
          "-DCORVUSCORE_GB_TEST_ROMS=$RUNNER_TEMP/gb-test-roms"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Verify CorvusAPI exports
        run: |
          for system in gb gbc gba; do
            test -f "build/libcorvus_${system}.so"
            nm -D --defined-only "build/libcorvus_${system}.so" | grep -q ' corvus_get_api$'
            nm -D --defined-only "build/libcorvus_${system}.so" | grep -q ' corvus_get_achievements_api$'
          done
      - name: Install and consume SDK
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/corvuscore"
          cmake -S sdk/tests/package_consumer -B build/package_consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/corvuscore"
          cmake --build build/package_consumer
          build/package_consumer/corvuscore_package_consumer
  sanitizers:
    name: Engines under ASan and UBSan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SANITIZE: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify no retired frontend references
        run: bash tools/check_external_frontend_refs.sh
      - name: Fetch public GBA test ROMs
        run: cores/gba/tests/fetch_test_roms.sh "$RUNNER_TEMP/gba-test-roms"
      - name: Fetch public GB/GBC test ROMs
        run: cores/gb/tests/fetch_test_roms.sh "$RUNNER_TEMP/gb-test-roms"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          "-DCORVUSCORE_GBA_TEST_ROMS=$RUNNER_TEMP/gba-test-roms"
          "-DCORVUSCORE_GB_TEST_ROMS=$RUNNER_TEMP/gb-test-roms"
          "-DCMAKE_CXX_FLAGS=$SANITIZE -D_GLIBCXX_ASSERTIONS"
          "-DCMAKE_EXE_LINKER_FLAGS=$SANITIZE"
          "-DCMAKE_SHARED_LINKER_FLAGS=$SANITIZE"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
  windows:
    name: Windows engines and CorvusAPI
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCORVUSCORE_BUILD_CORVUSAPI=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install and consume SDK
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/corvuscore"
          cmake -S sdk/tests/package_consumer -B build/package_consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/corvuscore" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build/package_consumer --config Release
          build/package_consumer/Release/corvuscore_package_consumer.exe
  macos:
    name: macOS engines and CorvusAPI
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCORVUSCORE_BUILD_CORVUSAPI=ON
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and consume SDK
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/corvuscore"
          cmake -S sdk/tests/package_consumer -B build/package_consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/corvuscore"
          cmake --build build/package_consumer
          build/package_consumer/corvuscore_package_consumer
  android:
    name: Android engines and CorvusAPI (${{ matrix.abi }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Locate NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          test -n "$ndk" || exit 1
          echo "NDK=$ndk" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCORVUSCORE_BUILD_CORVUSAPI=ON
          "-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify modules
        run: |
          nm="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for system in gb gbc gba; do
            module="build/libcorvus_${system}.so"
            test -f "$module"
            "$nm" -D --defined-only "$module" | grep -q ' corvus_get_api$'
          done
