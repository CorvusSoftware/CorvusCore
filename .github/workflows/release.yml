name: Release
# Publish the tagged SDK and CorvusAPI native modules.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true
env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
jobs:
  notes:
    name: Verify version and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve source
        id: source
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $TAG"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            sha=$(git rev-parse "refs/tags/$TAG^{commit}")
            git checkout --detach "$sha"
          else
            status=$?
            if [ "$status" != 2 ]; then exit "$status"; fi
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        run: |
          version="${TAG#v}"
          grep -Fq "project(CorvusCore VERSION $version " CMakeLists.txt
          mkdir -p notes
          awk -v heading="## $version " '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > notes/notes.md
          test -s notes/notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes/notes.md
  sdk:
    name: SDK and CorvusAPI (${{ matrix.platform }})
    needs: notes
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-latest
          - platform: macos-universal
            os: macos-latest
          - platform: android-arm64-v8a
            os: ubuntu-latest
            abi: arm64-v8a
          - platform: android-armeabi-v7a
            os: ubuntu-latest
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.notes.outputs.sha }}
          submodules: recursive
      - name: Configure
        env:
          PLATFORM: ${{ matrix.platform }}
          ABI: ${{ matrix.abi }}
        run: |
          case "$PLATFORM" in
            linux-*)
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCORVUSCORE_BUILD_CORVUSAPI=ON ;;
            windows-*)
              cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCORVUSCORE_BUILD_CORVUSAPI=ON ;;
            macos-*)
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
                -DCORVUSCORE_BUILD_CORVUSAPI=ON \
                "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ;;
            android-*)
              ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
              test -n "$ndk" || { echo "Android NDK missing"; exit 1; }
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                -DCORVUSCORE_BUILD_CORVUSAPI=ON \
                "-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake" \
                "-DANDROID_ABI=$ABI" -DANDROID_PLATFORM=android-24 ;;
          esac
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test native SDK
        if: ${{ !startsWith(matrix.platform, 'android-') }}
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package SDK and modules
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          stage="corvuscore-$TAG-$PLATFORM"
          cmake --install build --config Release --prefix "$PWD/$stage/sdk"
          mkdir -p "$stage/modules"
          for system in gb gbc gba; do
            case "$PLATFORM" in
              windows-*) pattern="corvus_${system}.dll" ;;
              macos-*) pattern="libcorvus_${system}.dylib" ;;
              *) pattern="libcorvus_${system}.so" ;;
            esac
            module=$(find build -type f -name "$pattern" -print -quit)
            test -n "$module" || { echo "Missing module $pattern"; exit 1; }
            cp "$module" "$stage/modules/"
          done
          case "$PLATFORM" in
            linux-*) tar -czf "$stage.tar.gz" "$stage" ;;
            *) cmake -E tar cf "$stage.zip" --format=zip "$stage" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-${{ matrix.platform }}
          path: |
            corvuscore-*.zip
            corvuscore-*.tar.gz
          if-no-files-found: error
  publish:
    name: Publish GitHub release
    needs: [notes, sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.notes.outputs.sha }}
        run: |
          mapfile -d '' assets < <(find artifacts -type f -name 'corvuscore-*' -print0)
          test "${#assets[@]}" -eq 5
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "CorvusCore ${TAG#v}" --notes-file artifacts/release-notes/notes.md --target "$SHA"
